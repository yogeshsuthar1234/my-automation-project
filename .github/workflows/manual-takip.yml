name: Manual Username Takip Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'

permissions:
  contents: write

env:
  MANUAL_RUN_MINUTES: '100'
  MANUAL_REMOVE_AFTER_FAILS: '7'
  MANUAL_MAX_CYCLES: '0'
  DISABLE_LOGIN_OTP: 'true'
  HEADLESS: 'true'

jobs:
  manual-takip:
    name: Run manual username queue
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./Auto
        run: npm install

      - name: Install Playwright Chromium
        working-directory: ./Auto
        run: npx playwright install chromium --with-deps

      - name: Show manual queue
        working-directory: ./Auto
        run: |
          if [ -f manual_usernames.json ]; then
            node -e "const q=require('./manual_usernames.json'); console.log('Active usernames:', (q.usernames||[]).filter(u => (typeof u === 'string') || u.status !== 'paused').length); console.log(JSON.stringify(q, null, 2));"
          else
            echo 'manual_usernames.json missing'
          fi

      - name: Run manual username automation
        working-directory: ./Auto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANUAL_RUN_MINUTES: ${{ env.MANUAL_RUN_MINUTES }}
          MANUAL_REMOVE_AFTER_FAILS: ${{ env.MANUAL_REMOVE_AFTER_FAILS }}
          MANUAL_MAX_CYCLES: ${{ env.MANUAL_MAX_CYCLES }}
          DISABLE_LOGIN_OTP: ${{ env.DISABLE_LOGIN_OTP }}
          HEADLESS: ${{ env.HEADLESS }}
        run: timeout 6300 npm run pipeline:manual || true

      - name: Commit queue updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Auto/manual_usernames.json
          if git diff --cached --quiet; then
            echo 'No manual queue updates to commit.'
          else
            git commit -m "Update manual username queue [skip ci]"
            git push
          fi

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-screenshots-run-${{ github.run_number }}
          path: Auto/screenshots/
          retention-days: 7
